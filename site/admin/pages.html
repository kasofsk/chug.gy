{{define "content"}}<h1>Pages</h1>
<div class="frame">
<table>
<thead><tr><th>Name</th><th>Own path</th><th>Served at</th></tr></thead>
<tbody>
{{range .Rows}}<tr>
<td><a href="/admin/pages/{{.Name}}">{{.Name}}</a></td>
<td><a href="{{.Path}}"><code>{{.Path}}</code></a></td>
<td>{{range $i, $sl := .Slots}}{{if $i}}, {{end}}<code>{{$sl.Route}}</code>{{with $sl.Test}} through test {{.}}{{end}}{{else}}<span class="none">none</span>{{end}}</td>
</tr>
{{end}}</tbody>
</table>
</div>
{{end}}
